apiVersion: taas/v1
kind: Mapping

metadata:
  name: patient-sink
  owner: platform-team
  revision: 3
  updatedAt: 2026-03-05T18:02:08.144177028Z
  lastPublishedAt: 2026-03-05T18:02:08.144177028Z
  lastPublishResult: SUCCESS
  commitSha: 4f32bbd

selector:
  connectorName: patient-sink

output:
  mode: CONNECT_MAP
  complexTypes: NATIVE_JSON

fields:
  - target: patient_resource
    path: "$.entry[?(@.resource.resourceType == 'Patient')].resource"
    type: STRING
    required: true
  - target: patient_id
    path: "$.entry[?(@.resource.resourceType == 'Patient')].resource.id"
    type: STRING
    required: true
  - target: patient_family_name
    path: "$.entry[?(@.resource.resourceType == 'Patient')].resource.name[0].family"
    type: STRING
    required: false
  - target: patient_gender
    path: "$.entry[?(@.resource.resourceType == 'Patient')].resource.gender"
    type: STRING
    required: false
  - target: patient_birth_date
    path: "$.entry[?(@.resource.resourceType == 'Patient')].resource.birthDate"
    type: STRING
    required: false
